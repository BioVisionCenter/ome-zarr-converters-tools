name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

# cancel in-progress runs that use the same workflow and branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Lint from the committed pixi.lock: every tool version CI runs is a
      # reviewed fact in the repo, not whatever PyPI published today. Upgrades
      # happen deliberately via `pixi update` / `prek auto-update`.
      - name: 🔧 Set up pixi
        uses: prefix-dev/setup-pixi@v0.10.1
        with:
          environments: dev

      - name: 🧹 Lint
        # prek (drop-in pre-commit replacement) runs ruff, typos,
        # validate-pyproject and nbstripout — see .pre-commit-config.yaml
        run: pixi run -e dev lint

      - name: Type check
        # Scope to `src` (the shipped package); tests use intentionally loose
        # typing (MagicMock, untyped fixtures). Run inside the pixi env so the
        # [tool.ty.environment] python path resolves as it does locally.
        run: pixi run -e dev ty check src

  test:
    name: ${{ matrix.platform }} (${{ matrix.python-version }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        platform: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - name: 🐍 Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache-dependency-path: "pyproject.toml"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install -U pip
          python -m pip install .[test]

      - name: 🧪 Run Tests
        run: pytest

      - name: Coverage
        if: matrix.python-version == '3.12' && matrix.platform == 'ubuntu-latest'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: /home/runner/work/ome-zarr-converters-tools/ome-zarr-converters-tools/coverage.xml

  deploy:
    name: Deploy
    needs: test
    if: success() && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    permissions:
      # IMPORTANT: this permission is mandatory for trusted publishing on PyPi
      # see https://docs.pypi.org/trusted-publishers/
      id-token: write
      # This permission allows writing releases
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: 👷 Build
        run: |
          python -m pip install build
          python -m build

      - name: 🚢 Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: "./dist/*"
