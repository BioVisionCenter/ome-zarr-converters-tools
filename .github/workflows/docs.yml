# Docs — documentation build and deploy
#
# Scope:    Runs on push to main (deploys the `dev` alias) and on version tags
#           (deploys `stable`). Uses the pixi docs environment, so the deploy
#           resolves the same tool versions as a local build.
# Jobs:     deploy (mike + zensical)
#
# Note:     The docs are built by Zensical, and versioned with the Zensical
#           maintainers' fork of mike (installed from git via the pixi docs
#           feature, since it is not published to PyPI). The mike CLI and the
#           gh-pages layout are unchanged, so already-published versions stay
#           browsable.
#
#           PRs are covered by the `docs` job in ci.yml instead, which builds the
#           same site without needing `contents: write`.
name: Docs

on:
  push:
    branches:
      - main
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  deploy:
    name: Deploy docs
    runs-on: ubuntu-latest

    permissions:
      contents: write # mike pushes the built docs to the gh-pages branch

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 🔧 Set up pixi
        uses: prefix-dev/setup-pixi@v0.10.1
        with:
          environments: docs

      # `mike deploy` builds the site itself, but its internal build is not strict:
      # `zensical build` exits 0 even when a markdown-exec code block raises, which
      # would publish tracebacks. Build once up front with --strict to fail fast.
      - name: 🔍 Verify docs build
        run: pixi run -e docs build_docs

      - name: 🚀 Deploy docs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Checkout uses persist-credentials: false; authenticate the push that
          # mike performs to the gh-pages branch via the gh credential helper.
          gh auth setup-git
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # A stable release is a tag starting with "v" and containing only numbers
          # and dots; a push to main publishes the dev docs. `set-default` is scoped
          # to each branch of this condition on purpose — running it unconditionally
          # flipped the published default back to `dev` after every release.
          VERSION="${GITHUB_REF_NAME}"
          echo "Deploying version ${VERSION}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${VERSION}" =~ ^v[0-9.]+$ ]]; then
            pixi run -e docs mike deploy --push --update-aliases "${VERSION}" stable
            pixi run -e docs mike set-default --push stable
            echo "Deployed stable version ${VERSION} (stable)"

          elif [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            pixi run -e docs mike deploy --push dev
            pixi run -e docs mike set-default --push dev
            echo "Deployed development version (dev) from main"
          fi
