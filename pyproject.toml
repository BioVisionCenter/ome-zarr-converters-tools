# https://peps.python.org/pep-0517/
[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# https://hatch.pypa.io/latest/config/metadata/
[tool.hatch.version]
source = "vcs"

# read more about configuring hatch at:
# https://hatch.pypa.io/latest/config/build/
[tool.hatch.build.targets.wheel]
packages = ["src/ome_zarr_converters_tools/"]

# Clean up the source distribution to avoid big tag.gz files
[tool.hatch.build.targets.sdist]
exclude = [
    # Pixi lock excluded by default see https://github.com/fractal-analytics-platform/fractal-server/issues/2624
    "pixi.lock",
    # Exclude tests from the source distribution
    "tests",
    # Exclude typically large files and directories that are not needed
    # This might not exists or be named differently in your project
    # TBD if we want to include these or not
    "docs/*",
    # The docs snippets write their OME-Zarr output here
    "data",
    ".github",
    # NB all things in .gitignore are excluded by default of hatchling
]

# https://peps.python.org/pep-0621/
[project]
name = "ome-zarr-converters-tools"
dynamic = ["version"]
description = "Tooling to build ome-zarr HCS plate converters"
readme = "README.md"
requires-python = ">=3.11, <3.15"
license = { text = "BSD-3-Clause" }
authors = [{ name = "Lorenzo Cerrone", email = "lorenzo.cerrone@uzh.ch" }]
# https://pypi.org/classifiers/
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
# add your package dependencies here
dependencies = [
    "ngio>=0.5.8,<0.6.0",
    "numpy>=1.26",
    "pillow>=10.0",
    "tifffile>=2024.1.30",
    "fsspec>=2024.2.0",
]

# https://peps.python.org/pep-0621/#dependencies-optional-dependencies
# "extras" (e.g. for `pip install .[test]`)
[project.optional-dependencies]
# s3:// URL support for fsspec
s3 = ["s3fs>=2024.2.0"]
# add dependencies used for testing here
test = [
    "pytest",
    "pytest-cov",
    "devtools",
    "pandas",                            # used directly by the integration tests
    "s3fs>=2024.2.0",
    "aiomoto",                           # mocking AWS s3 for testing
    "fractal-task-tools>=0.5.0,<0.6.0", # JSON-schema compatibility tests
]
# add anything else you like to have in your dev environment here
dev = [
    "ipycytoscape",               #
    "check-manifest>=0.51,<0.52",
    "plotly",
    "notebook",
    "matplotlib",
    "ipython",
    "ty",
    "pdbpp",                      # https://github.com/pdbpp/pdbpp
    "prek",                       # drop-in pre-commit replacement, see .pre-commit-config.yaml
    "rich",                       # https://github.com/Textualize/rich
    "ruff>=0.16,<0.17",           # keep in sync with .pre-commit-config.yaml
]

zarrs = ["zarrs"]

docs = [
    "zensical",
    "mkdocstrings[python]>=1.0.2,<1.1.0",
    "mkdocs-autorefs",
    "markdown-exec[ansi]",
    # Was only transitive via mkdocs-material, which Zensical replaces.
    "pymdown-extensions",
    "griffe-typingdoc",
    "matplotlib",
    "pandas",       # the tutorials build their tile tables with it
    "tabulate",
    "rich",
]
# `mike` is deliberately NOT listed above: Zensical needs the maintainers' fork, which is
# only installable from git, and a PEP 508 direct reference in optional-dependencies would
# make this package unpublishable to PyPI. It lives in the pixi docs feature instead.


[project.urls]
homepage = "https://github.com/BioVisionCenter/ome-zarr-converters-tools"
repository = "https://github.com/BioVisionCenter/ome-zarr-converters-tools"
documentation = "https://BioVisionCenter.github.io/ome-zarr-converters-tools/"
changelog = "https://github.com/BioVisionCenter/ome-zarr-converters-tools/blob/main/CHANGELOG.md"

# Entry points
# https://peps.python.org/pep-0621/#entry-points
# same as console_scripts entry point
# [project.scripts]
# ome-zarr-converters-tools-cli = "ome_zarr_converters_tools:main_cli"

# The snapshot-testing pytest plugin (--update-snapshots / --extended, the
# `extended` marker, and the `update_snapshots` fixture) is loaded explicitly via
# `pytest_plugins = ["ome_zarr_converters_tools.testing.plugin"]` in each
# consumer's tests/conftest.py — NOT via a pytest11 entry point. An entry point
# would import the package during pytest's plugin bootstrap (before pytest-cov
# starts), leaving the whole package "module-not-measured" and deflating coverage.

# https://docs.astral.sh/ruff
[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src"]

# https://docs.astral.sh/ruff/rules
[tool.ruff.lint]
pydocstyle = { convention = "google" }
select = [
    "E",    # style errors
    "W",    # style warnings
    "F",    # flakes
    "D",    # pydocstyle
    "D417", # Missing argument descriptions in Docstrings
    "I",    # isort
    "UP",   # pyupgrade
    "C4",   # flake8-comprehensions
    "B",    # flake8-bugbear
    "A001", # flake8-builtins
    "RUF",  # ruff-specific rules
    "TC",   # flake8-type-checking
    "TID",  # flake8-tidy-imports
]
ignore = [
    "D401", # First line should be in imperative mood (remove to opt in)
    "D415", # First line should end with a period (remove to opt in)
]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["D", "S"]
# Each snippet section repeats its own imports so it stands alone as a rendered block,
# which means module-level imports after code (E402) and re-imports (F811) are the point
# rather than a mistake. Import order is authored for the reader, so isort stays off.
"docs/snippets/**/*.py" = ["D", "E402", "F811", "I001"]

# https://docs.astral.sh/ruff/formatter/
[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 89
skip-magic-trailing-comma = false # default is false

[tool.ty.environment]
python = ".pixi/envs/dev"

# https://docs.pytest.org/
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
filterwarnings = [
    "ignore:Writing zarr v2 data will no longer be the default:UserWarning",
]
addopts = [
    "--color=yes",
    "--cov",
    "--cov-report=term-missing",
    "--cov-report=xml",
]
markers = [
    "slow: tests that take significant time to run",
    "integration: integration tests requiring I/O or external resources",
]

# https://coverage.readthedocs.io/
[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "@overload",
    "except ImportError",
    "\\.\\.\\.",
    "raise NotImplementedError()",
    "pass",
]

[tool.coverage.run]
source = ["ome_zarr_converters_tools"]

# https://github.com/mgedmin/check-manifest#configuration
# add files that you want check-manifest to explicitly ignore here
# (files that are in the repo but shouldn't go in the package)
[tool.check-manifest]
ignore = [
    ".pre-commit-config.yaml",
    ".ruff_cache/**/*",
    "tests/**/*",
    # Tracked so CI lints from the locked environment, but excluded from the sdist
    "pixi.lock",
]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[tool.pixi.pypi-dependencies]
ome-zarr-converters-tools = { path = ".", editable = true }

[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev", "test"], solve-group = "default" }
test = { features = ["test"], solve-group = "default" }
docs = { features = ["docs"], solve-group = "default" }

[tool.pixi.feature.dev.tasks]
ruff-fix-imports = { cmd = "ruff check --select I --fix" }
ruff = { cmd = "ruff format", depends-on = ["ruff-fix-imports"] }
test = { cmd = "pytest", depends-on = ["ruff"] }
lint = { cmd = "prek run --all-files" }
chores = { depends-on = ["test", "lint"] }

[tool.pixi.feature.docs.pypi-dependencies]
# Zensical's versioning story is a fork of mike that is not published to PyPI.
# Kept here rather than in [project.optional-dependencies] so this package stays
# publishable (PyPI rejects direct URL references).
mike = { git = "https://github.com/squidfunk/mike.git" }

[tool.pixi.feature.docs.tasks]
serve_docs = "zensical serve"
# --strict matters: without it `zensical build` exits 0 and prints "No issues found"
# even when a markdown-exec code block raised, silently publishing tracebacks.
# --clean avoids reusing cached HTML from a previous (possibly broken) build.
build_docs = "zensical build --clean --strict"
# The snippets write their OME-Zarr output under ./data (gitignored). A build
# interrupted mid-write leaves a partial store that the next run then fails on.
clean_docs_data = "rm -rf ./data"
snip_hcs_plates = "python docs/snippets/getting_started/hcs_plates.py > /dev/null"
snip_single_images = "python docs/snippets/getting_started/single_images.py > /dev/null"
snip_programmatic_tiles = "python docs/snippets/getting_started/programmatic_tiles.py > /dev/null"
# Must stay sequential: the scripts all write beneath ./data and the HCS one recreates
# the plate root with OverwriteMode.OVERWRITE. (`depends-on` would run them in parallel.)
test_snippets = """
python docs/snippets/getting_started/hcs_plates.py > /dev/null &&
python docs/snippets/getting_started/single_images.py > /dev/null &&
python docs/snippets/getting_started/programmatic_tiles.py > /dev/null
"""
